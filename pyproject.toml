[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traffic-signal-controller"
version = "0.1.0"
description = "Adaptive traffic signal control with SUMO and deep reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "traci==1.20.0",
    "sumolib==1.20.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.2"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
